services:
  # ---------------------------------------------------------------------------
  # 1. Backend REST API (Node.js + Express + Mongoose)
  # ---------------------------------------------------------------------------
  - type: web
    name: habit-tracker-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Input your MongoDB Atlas connection string in Render Dashboard
      - key: JWT_SECRET
        generateValue: true # Automatically generates a secure random 32-character key
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGIN
        sync: false # Input your frontend live URL (e.g. https://habit-tracker-client.onrender.com)

  # ---------------------------------------------------------------------------
  # 2. Frontend Web App (React + Vite SPA)
  # ---------------------------------------------------------------------------
  - type: static
    name: habit-tracker-client
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # SPA rewrite rule so refreshing deep links (/habits/123) works smoothly
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Input your backend API URL + /api (e.g. https://habit-tracker-api.onrender.com/api)

