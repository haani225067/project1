services:
  # ---------------------------------------------------------------------------
  # Full-Stack Web Service (Node.js + Express API + React Vite Client)
  # Deploys as a single unified service: Zero CORS issues, 100% Free Tier compatible
  # ---------------------------------------------------------------------------
  - type: web
    name: habit-tracker
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Set your MongoDB Atlas connection string in the Render Dashboard
      - key: JWT_SECRET
        generateValue: true # Render auto-generates a secure 32-character random key
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGIN
        value: '*'
